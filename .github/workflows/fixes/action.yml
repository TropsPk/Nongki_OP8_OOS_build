      # ---- WARN-1..10  build warning cleanup (kernel tree) ----
      - name: "🩹 [WARN-1] f_accessory.c: signed 1-bit fields"
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # struct acc_dev declares "int online:1;" and "int disconnected:1;". A signed 1-bit
          # field can only hold 0 and -1, so "dev->online = 1" reads back as -1 and clang warns:
          #   warning: implicit truncation from 'int' to a one-bit wide bit-field changes value
          #   from 1 to -1 [-Wsingle-bit-bitfield-constant-conversion]   (3 sites)
          # Make both fields unsigned. Size and layout stay the same and every user only tests
          # them for zero / non-zero.
          SRC="drivers/usb/gadget/function/f_accessory.c"

          if [ -f "$SRC" ]; then
            for field in online disconnected; do
              if grep -qE "^[[:space:]]*int $field:1;" "$SRC"; then
                sed -i -E "s/^([[:space:]]*)int $field:1;/\1unsigned int $field:1;/" "$SRC"
                echo "[+] f_accessory.c: $field is now an unsigned bit-field."
              elif grep -qE "^[[:space:]]*unsigned int $field:1;" "$SRC"; then
                echo "[+] f_accessory.c: $field already unsigned, skipping."
              else
                echo "[-] f_accessory.c: '$field:1' bit-field not found in expected form."
                false
              fi
            done
          else
            echo "[-] $SRC not found."
            false
          fi

      - name: "🩹 [WARN-2] coresight-tmc.c: sscanf field width"
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # The buffer-size store handler parses its input with
          #   sscanf(buf, "%10s", str)      into   char str[10]
          # "%10s" stores up to 10 characters plus the terminating NUL = 11 bytes, one past the
          # buffer (-Wfortify-source). The strlen(buf) >= 10 check just above already limits the
          # input to 9 characters, so "%9s" is behaviour-identical and in bounds.
          SRC="drivers/hwtracing/coresight/coresight-tmc.c"

          if [ -f "$SRC" ]; then
            if grep -qF 'sscanf(buf, "%10s", str)' "$SRC"; then
              sed -i 's/sscanf(buf, "%10s", str)/sscanf(buf, "%9s", str)/' "$SRC"
              echo "[+] coresight-tmc.c: sscanf width 10 -> 9."
            elif grep -qF 'sscanf(buf, "%9s", str)' "$SRC"; then
              echo "[+] coresight-tmc.c: already patched, skipping."
            else
              echo "[-] coresight-tmc.c: sscanf(buf, \"%10s\", str) not found in expected form."
              false
            fi
          else
            echo "[-] $SRC not found."
            false
          fi

