      - name: "🩹 [AUDIO-4] q6afe.c: smartpa_pm functions not static"
        if: env.MERGE_AUDIO == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          # OnePlus's dsp/q6afe.c defines set_smartpa_pm_status_apr() and
          # get_smartpa_pm_result_apr() as "static int" followed by EXPORT_SYMBOL(). They are
          # called from a different file (asoc/codecs/smartpa_pm/smartpa_pm.c, via extern
          # declarations). With CONFIG_MODULES disabled EXPORT_SYMBOL() expands to nothing,
          # so two things break:
          #   q6afe.c: error: unused function 'set_smartpa_pm_status_apr' [-Werror,-Wunused-function]
          #   link:    smartpa_pm.o -> undefined reference (the symbols are file-local)
          # ppajda / XTD define both as plain "int" (non-static). Do the same.
          SRC="kernel/msm-4.19/techpack/audio/dsp/q6afe.c"

          if [ -f "$SRC" ]; then
            for fn in set_smartpa_pm_status_apr get_smartpa_pm_result_apr; do
              if grep -q "^static int $fn(void \*buf, int cmd_size)" "$SRC"; then
                sed -i "s/^static int $fn(void \*buf, int cmd_size)/int $fn(void *buf, int cmd_size)/" "$SRC"
                echo "[+] q6afe.c: $fn is no longer static."
              elif grep -q "^int $fn(void \*buf, int cmd_size)" "$SRC"; then
                echo "[+] q6afe.c: $fn already non-static, skipping."
