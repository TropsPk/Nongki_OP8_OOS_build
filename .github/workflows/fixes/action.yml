      - name: "🩹 [WARN-6] powerkey_monitor.c: variable length arrays"
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # powerkey_monitor.c sizes two stack buffers with file-scope constants:
          #   static const int flow_size = 16;
          #   static const int stage_brief_size = 64;
          #   static const int stage_total_size = stage_brief_size*flow_size;
          #   char stages[stage_total_size]; char buffer[stage_brief_size];
          # In C a "static const int" is not a constant expression, so those are variable length
          # arrays (-Wvla-extension, 2 sites; the kernel builds as gnu89). Enum constants are real
          # constant expressions with the same values. This file has CRLF line endings, so the
          # sed keeps a trailing \r.
          SRC="drivers/soc/oplus/system/theia/powerkey_monitor.c"

          if [ -f "$SRC" ]; then
            for c in flow_size stage_brief_size stage_total_size; do
              if grep -qE "^static const int $c = " "$SRC"; then
                sed -i --follow-symlinks -E "s/^static const int $c = (.*);(\r?)$/enum { $c = \1 };\2/" "$SRC"
                grep -qE "^enum \{ $c = " "$SRC" || { echo "[-] powerkey_monitor.c: $c did not convert."; false; }
                echo "[+] powerkey_monitor.c: $c is now an enum constant."
              elif grep -qE "^enum \{ $c = " "$SRC"; then
                echo "[+] powerkey_monitor.c: $c already an enum constant, skipping."
              else
                echo "[-] powerkey_monitor.c: '$c' constant not found in expected form."
                false
              fi
            done
          else
            echo "[-] $SRC not found — was the vendor/devicetree layout set up first?"
            false
          fi

      - name: "🩹 [WARN-7] block/Makefile: blk-mq.c csd alignment"
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # struct request embeds a plain struct __call_single_data (8-byte aligned) but
          # smp_call_function_single_async() takes the 32-byte aligned call_single_data_t:
          #   warning: passing 8-byte aligned argument to 32-byte aligned parameter 2
          #   [-Walign-mismatch]   (blk-mq.c)
          # This is how the 4.19 sources are written and it is harmless on arm64 (the alignment
          # is only a cache-line hint). Silence it for blk-mq.o only instead of changing the size
          # and layout of struct request. The warning is silenced, not removed.
          MK="block/Makefile"

          if [ -f "$MK" ]; then
            if grep -q 'CFLAGS_blk-mq.o' "$MK"; then
              echo "[+] block/Makefile: already patched, skipping."
            else
              printf '\n# -Walign-mismatch: upstream request->csd alignment quirk, harmless on arm64\nCFLAGS_blk-mq.o += $(call cc-option,-Wno-align-mismatch)\n' >> "$MK"
              grep -q 'CFLAGS_blk-mq.o' "$MK" || { echo "[-] block/Makefile: flag did not apply."; false; }
              echo "[+] block/Makefile: -Wno-align-mismatch for blk-mq.o."
            fi
          else
            echo "[-] $MK not found."
            false
          fi

      - name: "🩹 [WARN-8] power Kconfig: duplicate OPLUS_* symbol types"
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # Six charger symbols are declared twice: as tristate in drivers/power/Kconfig and
          # again as bool in the OnePlus charger Kconfig sourced later through drivers/power/oplus.
          # Kconfig keeps the first (tristate) type and warns on every parse:
          #   drivers/power/oplus/Kconfig:36:warning: ignoring type redefinition of
          #   'OPLUS_SHIP_MODE_SUPPORT' from 'tristate' to 'bool'      (6 symbols)
          # With CONFIG_MODULES disabled tristate behaves exactly like bool, so declare them bool
          # here. The resolved .config is unchanged and the warnings are gone.
          K="drivers/power/Kconfig"

          if [ -f "$K" ]; then
            for sym in OPLUS_SHORT_C_BATT_CHECK OPLUS_SHORT_IC_CHECK OPLUS_SHORT_HW_CHECK OPLUS_RTC_DET_SUPPORT OPLUS_CHECK_CHARGERID_VOLT OPLUS_SHIP_MODE_SUPPORT; do
              if ! grep -q "^config $sym\$" "$K"; then
                echo "[-] $K: config $sym not found."
                false
              fi
              BLOCK="$(sed -n "/^config $sym\$/,/^config /p" "$K")"
              if grep -q '^[[:space:]]*tristate ' <<< "$BLOCK"; then
                sed -i "/^config $sym\$/,/^config /s/^\([[:space:]]*\)tristate /\1bool /" "$K"
                BLOCK="$(sed -n "/^config $sym\$/,/^config /p" "$K")"
                grep -q '^[[:space:]]*bool ' <<< "$BLOCK" || { echo "[-] $K: $sym was not converted."; false; }
                echo "[+] Kconfig: $sym tristate -> bool."
              else
                echo "[+] Kconfig: $sym already bool, skipping."
              fi
            done
          else
            echo "[-] $K not found."
            false
          fi

      - name: "🩹 [WARN-9] Makefile.lib: dtc style checks"
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # The stock Qualcomm / OnePlus device trees trip five dtc lint checks that are false
          # positives here (overlays are compiled without their parent node, so cell sizes and
          # phandle targets are unknown): reg_format, avoid_default_addr_size, gpios_property,
          # interrupts_property, pci_device_bus_num. That is 1357 warning lines per build, none
          # of which changes the compiled blob. Add them to the kernel's own -Wno- list in
          # DTC_FLAGS (next to avoid_unnecessary_addr_size). Unlike a blanket "-q" every other
          # dtc warning and all errors stay visible. The warnings are silenced, not removed.
          MK="scripts/Makefile.lib"

          if [ -f "$MK" ]; then
            if grep -q 'Wno-avoid_default_addr_size' "$MK"; then
              echo "[+] Makefile.lib: dtc style checks already disabled, skipping."
            elif grep -qE '^[[:space:]]-Wno-pci_device_reg$' "$MK"; then
              sed -i 's/^\t-Wno-pci_device_reg$/\t-Wno-pci_device_reg \\\n\t-Wno-pci_device_bus_num \\\n\t-Wno-avoid_default_addr_size \\\n\t-Wno-reg_format \\\n\t-Wno-gpios_property \\\n\t-Wno-interrupts_property/' "$MK"
              grep -q 'Wno-interrupts_property' "$MK" || { echo "[-] Makefile.lib: dtc flags did not apply."; false; }
              echo "[+] Makefile.lib: five dtc style checks disabled."
            else
              echo "[-] Makefile.lib: '-Wno-pci_device_reg' anchor not found."
              false
            fi
          else
            echo "[-] $MK not found."
            false
          fi

      - name: "🩹 [WARN-10] kona-perf_defconfig: duplicate assignments"
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # kona-perf_defconfig assigns 20 symbols twice (joystick / xpad, PlayStation / Sony
          # force feedback, SLUB_DEBUG, the NET_SCH / NET_CLS / NET_EMATCH / NET_ACT block,
          # NET_SCH_PRIO):
          #   warning: override: reassigning to symbol NET_SCH_PRIO
          # Kconfig applies the last assignment, so keep only the last one per symbol. The
          # resulting .config is unchanged (19 pairs are identical; SLUB_DEBUG was "is not set"
          # early and =y later, and =y is what already won).
          # This runs before "Apply OOS defconfig fragment". The patch still applies cleanly
          # on the deduplicated file (one hunk shifts by one line) and gives the same final
          # defconfig as deduplicating afterwards.
          D="arch/arm64/configs/vendor/kona-perf_defconfig"

          if [ -f "$D" ]; then
            awk '
              function sym(l,  m) {
                if (match(l, /^CONFIG_[A-Za-z0-9_]+=/)) return substr(l, 8, RLENGTH - 8)
                if (match(l, /^# CONFIG_[A-Za-z0-9_]+ is not set/)) { m = substr(l, 10); sub(/ is not set.*/, "", m); return m }
                return ""
              }
              NR == FNR { s = sym($0); if (s != "") last[s] = FNR; next }
              { s = sym($0); if (s == "" || last[s] == FNR) print; else print s > "/dev/stderr" }
            ' "$D" "$D" > "$D.dedup" 2> "$D.dropped"
            echo "[+] $D: dropped $(wc -l < "$D.dropped") superseded duplicate line(s)."
            sort -u "$D.dropped" | sed 's/^/    /'
            mv "$D.dedup" "$D"
            rm -f "$D.dropped"
          else
            echo "[-] $D not found."
            false
          fi
