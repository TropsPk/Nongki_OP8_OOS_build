name: 'Pack Process.'

runs:
  using: 'composite'
  steps:
      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")

          cd $GITHUB_WORKSPACE/kernel/msm-4.19/
          IMAGE_DIR="$GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/${{ env.KERNEL_ARCH }}/boot"

          mkdir -p tmp

          if [[ "${{ env.AK3_SOURCE }}" =~ "osm0sis" ]]; then
            sed -i 's/ExampleKernel by osm0sis @ xda-developers/NonGKI Kernel Build by JackAltman and Hotsteel2901 @ Github/g' Anykernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh
            echo "Now using official Anykernel3."

          else
            echo "Now using custom Anykernel3."

          fi

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp $IMAGE_DIR/Image.gz-dtb tmp
            echo "Found Image.gz-dtb !"

          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp $IMAGE_DIR/Image.gz tmp
            echo "Found Image.gz !"

          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            cp -fp $IMAGE_DIR/Image tmp
            echo "Found Image !"

          fi

          if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
            cp -fp $IMAGE_DIR/dtbo.img tmp
            echo "Found dtbo.img !"

          else
            echo "[-] Could not found dtbo.img! Your device maybe needn't the file."

          fi

          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp $IMAGE_DIR/dtb.img tmp/dtb
            echo "Found dtb.img, converted dtb !"

          elif [ -f "$IMAGE_DIR/dtb" ]; then
            echo "Found DTB!"
            cp -fp $IMAGE_DIR/dtb tmp

          elif [ "${{ env.GENERATE_DTB }}" == "true" ]; then
            if ls $IMAGE_DIR/dts/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts"
            elif ls $IMAGE_DIR/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts/vendor"
            else
                echo "[-] Could not found dts, abort."
                false
            fi

            cat $IMAGE_DIR/$DTB_PATH/${{ env.GENERATE_CHIP }}/*.dtb > $IMAGE_DIR/dtb
            cp -fp $IMAGE_DIR/dtb tmp
            echo "Generated ${{ env.GENERATE_CHIP }} DTB."
          else
            echo "[-] Could not found dtb or dtb.img! Your device maybe needn't the file."

          fi

          # Added kernel modules to Anykernel3
          if [ "${{ env.PACK_KMODULES }}" == "true" ]; then
            echo "[+] Packing kernel modules (.ko)..."
            mkdir -p tmp/modules/vendor/lib/modules
            find $GITHUB_WORKSPACE/kernel/msm-4.19/out/ -name "*.ko" -exec cp -fp {} tmp/modules/vendor/lib/modules/ \;

            if [ "$(ls -A tmp/modules/vendor/lib/modules/ 2>/dev/null)" ]; then
              echo "[+] Found and copied kernel modules."

            else
              echo "[-] No kernel modules found, skipping."
              rm -rf tmp/modules

            fi

          fi

          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip
          rm -rf tmp

          echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip" >> $GITHUB_ENV

      - name: Make Patched Boot Image (alongside kernel zip)
        # Builds an additional, ready-to-flash boot.img (and dtbo.img, if this
        # device produces one) next to the Anykernel3 zip above. Needs
        # BOOT_SOURCE set to a stock/source boot.img (plain or .zst-compressed)
        # for this device+build to unpack, patch the kernel of, and repack.
        if: env.PACK_METHOD == 'Anykernel3' && env.BOOT_SOURCE != ''
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/

          IMAGE_DIR="$GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/${{ env.KERNEL_ARCH }}/boot"
          TIME=$(date +"%Y%m%d%H%M%S")

          if [[ ! -d "$GITHUB_WORKSPACE/mkboottools" ]]; then
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg $GITHUB_WORKSPACE/mkboottools -b main-kernel-build-2024 --depth=1
          fi
          if [[ ! -f "$GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img" ]]; then
            if [[ "${{ env.BOOT_SOURCE }}" == *.zst ]]; then
              ${{ env.CURLX }} "${{ env.BOOT_SOURCE }}" $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img.zst
              command -v zstd >/dev/null 2>&1 || sudo apt-get install -y zstd
              zstd -d -f $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img.zst -o $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img
              rm -f $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img.zst
            else
              ${{ env.CURLX }} "${{ env.BOOT_SOURCE }}" $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img
            fi
          fi

          FORMAT_MKBOOTIMG=$(echo `mkboottools/unpack_bootimg.py --boot_img=boot_source_${{ env.DEVICE_NAME }}.img --format mkbootimg`)

          rm -rf out
          mkboottools/unpack_bootimg.py --boot_img boot_source_${{ env.DEVICE_NAME }}.img

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image.gz-dtb out/kernel
            echo "Found Image.gz-dtb !"

          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image.gz out/kernel
            echo "Found Image.gz !"

          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image out/kernel
            echo "Found Image !"

          fi

          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp $IMAGE_DIR/dtb.img out/dtb
            echo "Found dtb.img, converted dtb !"

          elif [ -f "$IMAGE_DIR/dtb" ]; then
            echo "Found DTB!"
            cp -fp $IMAGE_DIR/dtb out/dtb

          fi

          eval "mkboottools/mkbootimg.py $FORMAT_MKBOOTIMG -o boot.img"
          echo "BOOT_PACK_NAME=boot.img" >> $GITHUB_ENV
          echo "[+] Built boot.img from patched kernel."

          # Repacking with mkbootimg.py drops the source boot.img's AVB hash
          # footer entirely, leaving an unsigned, under-sized image (the
          # source partition is padded to a fixed size with a footer; our
          # fresh output is just header+kernel+ramdisk+dtb with nothing
          # after it). Restore a footer matching the original partition
          # size so the artifact is structurally correct. This uses
          # --algorithm NONE (unsigned) since we don't have OnePlus's
          # private signing key - it will not pass real AVB verification;
          # only a device with an unlocked bootloader / verification
          # disabled can boot an image signed this way.
          if [[ ! -d "$GITHUB_WORKSPACE/avb" ]]; then
            git clone https://android.googlesource.com/platform/external/avb $GITHUB_WORKSPACE/avb --depth=1
          fi

          ORIGINAL_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img")

          if python3 "$GITHUB_WORKSPACE/avb/avbtool.py" info_image --image "$GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img" 2>/dev/null | grep -q "^Footer version:"; then
            python3 "$GITHUB_WORKSPACE/avb/avbtool.py" add_hash_footer \
              --image "boot.img" \
              --partition_size "$ORIGINAL_SIZE" \
              --partition_name boot \
              --algorithm NONE
            echo "[+] Restored AVB hash footer (unsigned, partition_size=$ORIGINAL_SIZE)."
          else
            echo "[-] Source boot.img has no AVB footer, skipped."
          fi

          if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
            cp -fp "$IMAGE_DIR/dtbo.img" "${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-dtbo.img"
            echo "DTBO_PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-dtbo.img" >> $GITHUB_ENV
            echo "[+] Also staged dtbo.img (flashed separately: fastboot flash dtbo)."
          fi

          rm -f $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img

      - name: Make Latest Boot Image
        if: env.PACK_METHOD == 'MKBOOTIMG'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/

          IMAGE_DIR="$GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/${{ env.KERNEL_ARCH }}/boot"
          TIME=$(date +"%Y%m%d%H%M%S")
          FORMAT_MKBOOTING=$(echo `mkboottools/unpack_bootimg.py --boot_img=boot_source_${{ env.DEVICE_NAME }}.img --format mkbootimg`)

          mkdir -p tmp

          mkboottools/unpack_bootimg.py --boot_img boot_source_${{ env.DEVICE_NAME }}.img

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image.gz-dtb out/kernel
            echo "Found Image.gz-dtb !"

          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image.gz out/kernel
            echo "Found Image.gz !"

          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image out/kernel
            echo "Found Image !"

          fi

          if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
            cp -fp $IMAGE_DIR/dtbo.img tmp
            echo "Found dtbo.img !"

          else
            echo "[-] Could not found dtbo.img! Your device maybe needn't the file."

          fi

          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp $IMAGE_DIR/dtb.img out/dtb
            echo "Found dtb.img, converted dtb !"

          elif [ -f "$IMAGE_DIR/dtb" ]; then
            echo "Found DTB!"
            cp -fp $IMAGE_DIR/dtb out/dtb

          elif [ "${{ env.GENERATE_DTB }}" == "true" ]; then
            if ls $IMAGE_DIR/dts/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts"
            elif ls $IMAGE_DIR/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts/vendor"
            else
                echo "[-] Could not found dts, abort."
                false
            fi

            cat $IMAGE_DIR/$DTB_PATH/${{ env.GENERATE_CHIP }}/*.dtb > $IMAGE_DIR/dtb
            cp -fp $IMAGE_DIR/dtb out/dtb
            echo "[+] Generated ${{ env.GENERATE_CHIP }} dtb."

          else
            echo "[-] Could not found dtb! Your device maybe needn't the file."

          fi

          if [[ -f "tmp/dtbo.img" ]]; then
            eval "mkboottools/mkbootimg.py $FORMAT_MKBOOTING -o boot.img"
            cp -fp boot.img tmp/
            cd tmp
            7za a -mx9 tmp.zip *
            cd ..
            cp -fp tmp/tmp.zip ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-image.zip
            rm -rf tmp
            echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-image.zip" >> $GITHUB_ENV

          else
            eval "mkboottools/mkbootimg.py $FORMAT_MKBOOTING -o ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-image.img"
            echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-image.img" >> $GITHUB_ENV

          fi

          rm -f $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img
