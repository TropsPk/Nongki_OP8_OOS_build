name: 'Execute the compilation process.'

runs:
  using: 'composite'
  steps:
      - name: Added mkdtboimg to kernel (Experiment)
        if: env.HAVE_NO_DTBO == 'true' && env.HAVE_NO_DTBO_TOOL != 'true'
        shell: bash
        run: |
          # Get MKDTBO tool to kernel
          #
          # NOTE: previously this fetched
          #   .../libufdt/+archive/refs/heads/main/utils/src.tar.gz
          # via curl. Google's gitiles "+archive" tarball generator for this repo
          # does not reliably return gzip data to CI runners (it has been reported
          # to return an HTML/error body instead, in and outside this project),
          # which fails as: "gzip: stdin: not in gzip format". A plain `git clone`
          # against android.googlesource.com (the normal git-over-HTTP protocol,
          # not the tarball generator) does not have this problem and is already
          # used elsewhere in this repo (e.g. GCC_64_SOURCE/GCC_32_SOURCE and the
          # mkboottools clone in build-ready), so use that instead.
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/scripts/dtc
          git clone --depth=1 --branch main https://android.googlesource.com/platform/system/libufdt libufdt_src

          if [[ ! -f "libufdt_src/utils/src/mkdtboimg.py" ]]; then
            echo "[-] libufdt clone did not contain utils/src/mkdtboimg.py as expected."
            echo "[-] Contents of the clone:"
            find libufdt_src -maxdepth 3
            false
          fi

          cp -a libufdt_src/utils/src/. .
          rm -rf libufdt_src

          # Hook dtbo generate code to kernel
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          sed -i '/targets := Image Image.bz2 Image.gz Image.lz4 Image.lzma Image.lzo/s/$/ dtbo.img/' ./arch/"${{ env.KERNEL_ARCH }}"/boot/Makefile
          sed -i '/# Add RTIC DTB to the DTB list if RTIC MPGen is enabled/i \DTBO_OBJS := $(shell find $(obj)/dts/ -name \\*.dtbo)\n' arch/"${{ env.KERNEL_ARCH }}"/boot/Makefile
          sed -i '/^install:$/i \#DTBO\n$(obj)\/dtbo.img: $(DTBO_OBJS) FORCE\n\t$(call if_changed,mkdtimg)\n' ./arch/"${{ env.KERNEL_ARCH }}"/boot/Makefile
          sed -i '/KBUILD_DTBS\t:= dtbs/a \#DTBO\nKBUILD_DTBO_IMG := dtbo.img' ./arch/"${{ env.KERNEL_ARCH }}"/Makefile
          sed -i '/PHONY += vdso_install/i \ifeq ($(CONFIG_BUILD_ARM64_DT_OVERLAY),y)\n$(KBUILD_DTBO_IMG): dtbs\n\t$(Q)$(MAKE) $(build)=$(boot) $(boot)/$@\n\nall: $(KBUILD_DTBO_IMG)\nendif' arch/"${{ env.KERNEL_ARCH }}"/Makefile
          sed -i '/dtc-tmp = $(subst $(comma),_,$(dot-target)\.dts\.tmp)/a \#DTBO\n# mkdtimg\n#----------------------------------------------------------------------------\nquiet_cmd_mkdtimg = DTBOIMG $@\ncmd_mkdtimg = python3 $(srctree)\/scripts\/dtc\/mkdtboimg.py create $@ --page_size=4096 $(filter-out FORCE,$^)' ./scripts/Makefile.lib

          echo "[+] Added mkdtboimg into your kernel."

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: build-kernel-${{ env.DEVICE_NAME }}${{ env.UPLOADNAME }}
          max-size: 2G

      - name: Build Kernel
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/

          BUILD_PROCESS(){
          if [ -n "$1" ]; then
            echo "Select: $1"
            local BUILD_CLANG="$1"
          else
            BUILD_CLANG=""
          fi

          if [ -n "${{ env.CLANG_SOURCE }}" ]; then
            export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
          fi

          if [[ "$BUILD_CLANG" == "true" ]]; then
            echo "========================"
            echo "=Read Defconfig (Clang)="
            echo "========================"
            make CC="ccache clang" O=out ARCH="${{ env.KERNEL_ARCH }}" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} ${{ env.DEFCONFIG_NAME }}
          else
            echo "================"
            echo "=Read Defconfig="
            echo "================"
            make O=out ARCH="${{ env.KERNEL_ARCH }}" ${{ env.DEFCONFIG_NAME }}
          fi

          if [[ "${{ env.BUILD_OTHER_CONFIG }}"  == "true" ]]; then
            echo "================="
            echo "=Merge Config(s)="
            echo "================="
            IFS=',' read -ra MERGE_CONFIG_FILES <<< "${{ env.MERGE_CONFIG_FILES }}"
            for FILES in "${MERGE_CONFIG_FILES[@]}"; do
                ./scripts/kconfig/merge_config.sh -O out/ -m out/.config arch/"${{ env.KERNEL_ARCH }}"/configs/$FILES
            done
            if [[ "$BUILD_CLANG" == "true" ]]; then
                echo "==============================="
                echo "=Execuate olddefconfig (Clang)="
                echo "==============================="
                make CC="ccache clang" O=out ARCH="${{ env.KERNEL_ARCH }}" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} olddefconfig
            else
                echo "======================="
                echo "=Execuate olddefconfig="
                echo "======================="
                make O=out ARCH="${{ env.KERNEL_ARCH }}" olddefconfig
            fi
          fi

          if [[ "$BUILD_CLANG" == "true" ]]; then
            echo "======================"
            echo "=Execuate Clang Build="
            echo "======================"

            make -j$(nproc --all) CC="ccache clang" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} O=out ARCH="${{ env.KERNEL_ARCH }}" 2>&1|tee error.log
          else
            echo "===================="
            echo "=Execuate GCC Build="
            echo "===================="

            make -j$(nproc --all) O=out ARCH="${{ env.KERNEL_ARCH }}" 2>&1|tee error.log
          fi
          }

          if [ -n "${{ env.CLANG_SOURCE }}" ]; then
            if [ -n "${{ env.GCC_64 }}" ] && [ -n "${{ env.GCC_32 }}" ]; then
                echo "=================================="
                echo "=Detected Clang and GCC 64 and 32="
                echo "=================================="
                export "${{ env.GCC_64 }}"
                export "${{ env.GCC_32 }}"
                BUILD_PROCESS true
            elif [ "${{ env.GNU_GCC }}" == "true" ]; then
                echo "============================"
                echo "=Detected Clang and GNU GCC="
                echo "============================"
                export "${{ env.GCC_64 }}"
                export "${{ env.GCC_32 }}"
                BUILD_PROCESS true
            elif [ -n "${{ env.GCC_64 }}" ]; then
                echo "==========================="
                echo "=Detected Clang and GCC 64="
                echo "==========================="
                export "${{ env.GCC_64 }}"
                BUILD_PROCESS true
            else
                echo "====================="
                echo "=Detected Only Clang="
                echo "====================="
                BUILD_PROCESS true
            fi

          elif [ "${{ env.KERNEL_ARCH }}" == "arm64" ]; then
            if [ -n "${{ env.GCC_64 }}" ] && [ -n "${{ env.GCC_32 }}" ]; then
                echo "=================================="
                echo "=Detected ARM64 GCC 64 and GCC 32="
                echo "=================================="
                export "${{ env.GCC_64 }}"
                export "${{ env.GCC_32 }}"
                BUILD_PROCESS
            elif [ "${{ env.GNU_GCC }}" == "true" ]; then
                echo "========================"
                echo "=Detected ARM64 GNU GCC="
                echo "========================"
                export "${{ env.GCC_64 }}"
                export "${{ env.GCC_32 }}"
                BUILD_PROCESS
            elif [ -n "${{ env.GCC_64 }}" ]; then
                echo "============================"
                echo "=Detected ARM64 Only GCC 64="
                echo "============================"
                export "${{ env.GCC_64 }}"
                BUILD_PROCESS
            fi

          elif [ "${{ env.KERNEL_ARCH }}" == "arm" ]; then
            if [ "${{ env.GNU_GCC }}" == "true" ]; then
                echo "======================"
                echo "=Detected ARM GNU GCC="
                echo "======================"
                export "${{ env.GCC_32 }}"
                BUILD_PROCESS
            elif [ -n "${{ env.GCC_32 }}" ]; then
                echo "====================="
                echo "=Detected ARM GCC 32="
                echo "====================="
                export "${{ env.GCC_32 }}"
                BUILD_PROCESS
            fi

          else
            echo "invaild kernel arch, stop."
            false
          fi

      - name: Generate DTBO
        if: env.HAVE_NO_DTBO == 'true' && env.HAVE_NO_DTBO_TOOL == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          mkdir dtbo_tool
          cd dtbo_tool
          # Same "+archive" tarball-generator issue as the mkdtboimg fetch above
          # (see the comment there) — use a plain git clone instead. Also note the
          # old URL pinned "master", which is not this repo's current branch name.
          git clone --depth=1 --branch main https://android.googlesource.com/platform/system/libufdt libufdt_src

          if [[ ! -f "libufdt_src/utils/src/mkdtboimg.py" ]]; then
            echo "[-] libufdt clone did not contain utils/src/mkdtboimg.py as expected."
            echo "[-] Contents of the clone:"
            find libufdt_src -maxdepth 3
            false
          fi

          cp -a libufdt_src/utils/. .
          rm -rf libufdt_src
          cd ../
          if [ -d "$GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/"${{ env.KERNEL_ARCH }}"/boot/dts/vendor" ]; then
            python dtbo_tool/src/mkdtboimg.py create $GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/"${{ env.KERNEL_ARCH }}"/boot/dtbo.img $GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/"${{ env.KERNEL_ARCH }}"/boot/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtbo
          else
            python dtbo_tool/src/mkdtboimg.py create $GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/"${{ env.KERNEL_ARCH }}"/boot/dtbo.img $GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/"${{ env.KERNEL_ARCH }}"/boot/dts/${{ env.GENERATE_CHIP }}/*.dtbo
          fi

          if [[ -f "$GITHUB_WORKSPACE/kernel/msm-4.19/out/arch/"${{ env.KERNEL_ARCH }}"/boot/dtbo.img" ]]; then
            echo "[+] DTBO generated."
          else
            echo "[-] DTBO not generated. Please check your kernel."
          fi

      - name: Analyze compile error
        if: ${{ failure() && env.BUILD_DEBUGGER == 'true' }}
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/

          cp /tmp/Bin/check_error.sh ./
          cp /tmp/Bin/pack_error_files.sh ./

          bash check_error.sh
          bash pack_error_files.sh

      - name: Upload Build Error Files
        if: ${{ failure() && env.BUILD_DEBUGGER == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: compile_error_files
          path: |
            kernel/msm-4.19/error.log
            kernel/msm-4.19/error_files.zip
