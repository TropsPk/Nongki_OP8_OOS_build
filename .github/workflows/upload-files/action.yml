name: 'Upload files.'

runs:
  using: 'composite'
  steps:
      - name: Upload Build Artifacts For Anykernel3
        if: env.PACK_METHOD == 'Anykernel3'
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-${{ env.PACK_NAME }}
          path: |
            kernel/msm-4.19/${{ env.PACK_NAME }}

      - name: Upload Boot Image (alongside kernel zip)
        if: env.PACK_METHOD == 'Anykernel3' && env.BOOT_SOURCE != ''
        uses: actions/upload-artifact@v7
        with:
          name: Boot.img
          path: ${{ env.BOOT_PACK_NAME }}
          archive: false
          if-no-files-found: warn

      - name: Upload DTBO Image (alongside kernel zip)
        if: env.PACK_METHOD == 'Anykernel3' && env.BOOT_SOURCE != '' && env.DTBO_PACK_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.DTBO_PACK_NAME }}
          archive: false
          if-no-files-found: warn

      - name: Upload Build Artifacts For Boot Image
        if: env.PACK_METHOD == 'MKBOOTIMG'
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-${{ env.PACK_NAME }}
          path: |
            ${{ env.PACK_NAME }}
