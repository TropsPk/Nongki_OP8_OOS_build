name: Build Oneplus 8 (OxygenOS 13.1 A13) (Stock Kernel)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8"
  DEVICE_CODENAME : "instantnoodle"

  BRAND_SHOW_FLAG : "oneplus"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-android-"
  # OOS 4.19.157 old codebase + clang 19: disable clang's newer default -Werror strict warnings
  # KCFLAGS value must be quoted (it contains spaces), otherwise make only takes the first argument
  EXTRA_CMDS : 'KCFLAGS="-Wno-strict-prototypes -Wno-incompatible-function-pointer-types -Wno-deprecated-non-prototype -Wno-implicit-int -Wno-int-to-pointer-cast -Wno-pointer-to-int-cast -Wno-implicit-function-declaration -Wno-unused-but-set-variable"'

  # OOS official kernel (OnePlus OSS, 4.19.157) - device tree lives in a separate repo
  KERNEL_SOURCE : "https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "oneplus/sm8250_t_13.1_op8"

  # OOS official vendor/devicetree repo (contains oplus kernel modules + kona DTS + 19821 device tree
  # + kernel/msm-4.19/techpack's camera/display/video sources)
  # symlink points at vendor/, must be placed per OnePlus's official directory layout
  VENDOR_SOURCE : "https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250.git"
  VENDOR_BRANCH : "oneplus/sm8250_t_13.1_op8"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oos13.1_a13"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  NOMOUNT_ENABLE: "false"

  KERNEL_PATCH: "false"

  # OOS device tree compiles directly (non-overlay), generated via OnePlus's official Makefile
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  # devicetree-4.19/19821/Makefile's non-overlay branch has an upstream OnePlus typo
  # (dtb-$(CONFIG_ARCH_LITO) instead of CONFIG_ARCH_KONA), so on a Kona defconfig it
  # silently builds nothing for 19821 (the real OnePlus 8 profile). CONFIG_BUILD_ARM64_DT_OVERLAY=y
  # (set in defconfig_oos.patch) switches 19821 to its overlay branch instead, which uses
  # CONFIG_ARCH_KONA correctly — matching luk1337 and LineageOS's own kona-perf_defconfig.
  # HAVE_NO_DTBO hooks mkdtimg into the kernel's own Makefile so `make` builds dtbo.img
  # natively as part of the default target; Pack Process already picks up dtbo.img if present.
  HAVE_NO_DTBO: "true"
  HAVE_NO_DTBO_TOOL: "false"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  # OOS defconfig already embeds oplus config, no need to separately merge oplus.config
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 (OxygenOS 13.1 A13) (Stock Kernel)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🏗️ Setup OOS vendor/devicetree layout
        run: |
          # OnePlus OOS kernel's vendor symlink points at ../../../../../../vendor
          # (6 levels up from arch/arm64/boot/dts), so devicetree+oplus sources must land there
          # Layout: <ROOT>/kernel_src/arch/arm64/boot/dts -> 6 levels up -> <ROOT>/vendor
          # In this workflow msm-4.19 sits at $GITHUB_WORKSPACE/kernel/msm-4.19
          # whose 6-level-up parent is $GITHUB_WORKSPACE, so vendor goes at $GITHUB_WORKSPACE/vendor
          cd $GITHUB_WORKSPACE
          if [ ! -d vendor ]; then
            echo "[-] vendor/ not found, devicetree missing."
            false
          fi
          # Verify the critical symlinks resolve (devicetree + oplus kernel)
          cd kernel/msm-4.19
          for check in arch/arm64/boot/dts/vendor drivers/soc/oplus/system drivers/power/oplus fs/erofs; do
            if [ -e "$check" ]; then
              echo "[+] $check -> $(readlink -f $check)"
            else
              echo "[-] $check cannot resolve, OOS build will fail."
              false
            fi
          done
          echo "[+] OOS vendor/devicetree layout ready."

      - name: 📌 Kernel version suffix (OOS)
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          echo "-g$(git rev-parse --short HEAD)-oos-hotsteel" > .scmversion
          echo "[+] .scmversion written."

      - name: 📝 Apply OOS defconfig fragment
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/
          cp /tmp/Patches/Patch/defconfig_oos.patch ./
          patch -p1 < defconfig_oos.patch || true
          rm -f defconfig_oos.patch
          echo "[+] OOS defconfig applied."

      - name: "[1⁺] Apply OnePlus native features"
        run: |
          # oplus_native_features.mk is included by the top Makefile, but its plain
          # assignments are NOT exported to kbuild's per-directory sub-makes. On the
          # OnePlus Android build these are environment variables. Without them, the
          # OPLUS_FEATURE_* gates in mm/, drivers/scsi/ufs/ ... silently skip objects
          # (ufsfeature, ufs_signal_quality, ufs_latency_hist, task_mem, process_mm_reclaim).
          F="$GITHUB_WORKSPACE/kernel/msm-4.19/oplus_native_features.mk"
          if [ ! -f "$F" ]; then
            echo "[-] $F not found — check if OnePlus moved/renamed this file."
            false
          fi
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$' "$F" \
            | grep -vE '^(OPLUS_NATIVE_FEATURE_SET|OPLUS_NATIVE_MACRO_FEATURES)=' >> "$GITHUB_ENV"
          echo "[+] Exported $(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$' "$F") variables from oplus_native_features.mk."

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🖼️ Generate DTB (OOS concat kona dtb variants)
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          DTB_DIR="out/arch/arm64/boot/dts/vendor/19821"
          if [ -f "$DTB_DIR/kona-mtp.dtb" ]; then
            cat "$DTB_DIR/kona-mtp.dtb" > out/arch/arm64/boot/dtb.img
            echo "[+] Generated dtb.img from kona-mtp.dtb"
          else
            # Fallback: concatenate all dtbs under vendor (matches OnePlus's official AndroidKernel.mk)
            cat out/arch/arm64/boot/dts/vendor/*/*.dtb > out/arch/arm64/boot/dtb.img
            echo "[+] Generated dtb.img (concat all vendor dtbs)"
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
